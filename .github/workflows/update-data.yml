name: "Ceny PSE (RCEm, RCE) : odświeżenie i publikacja"

# PSE publikuje RCEm dziesiątego dnia roboczego kolejnego miesiąca, a ceny RCE codziennie w API raportów.
# Skrypt uruchamia się 12., 15. i 20. dnia każdego miesiąca (na wypadek późniejszej publikacji lub korekty),
# zapisuje okno 12 ostatnich miesięcy w src/data/prices.json, a potem serwis jest budowany i publikowany.
on:
  schedule:
    - cron: "0 7 12,15,20 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Read PSE prices (scheduled and manual runs)
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Commit the new prices
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json
          git diff --cached --quiet || (git commit -m "Ceny PSE odświeżone $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
